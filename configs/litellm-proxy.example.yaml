# Sample LiteLLM proxy config for reproducing ROK-FORTRESS.
#
# Launch:
#   pip install 'litellm[proxy]'
#   litellm --config configs/litellm-proxy.example.yaml --port 4000
#
# Then in .env:
#   BASE_URL=http://localhost:4000/v1
#   API_KEY=sk-anything
#
# Provider env vars below come from your shell / a separate .env --
# the proxy loads them at start-up. Only fill in the providers you need
# for the model panel you intend to evaluate.

model_list:
  # ── OpenAI ──
  - model_name: openai/gpt-5.2
    litellm_params: { model: openai/gpt-5.2, api_key: os.environ/OPENAI_API_KEY }
  - model_name: openai/o4-mini
    litellm_params: { model: openai/o4-mini, api_key: os.environ/OPENAI_API_KEY }
  - model_name: openai/gpt-4o-mini-2024-07-18
    litellm_params: { model: openai/gpt-4o-mini-2024-07-18, api_key: os.environ/OPENAI_API_KEY }

  # ── Anthropic ──
  - model_name: anthropic/claude-opus-4-5
    litellm_params: { model: anthropic/claude-opus-4-5, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: anthropic/claude-sonnet-4-5
    litellm_params: { model: anthropic/claude-sonnet-4-5, api_key: os.environ/ANTHROPIC_API_KEY }

  # ── Google Gemini ──
  - model_name: gemini/gemini-3-pro-preview
    litellm_params: { model: gemini/gemini-3-pro-preview, api_key: os.environ/GEMINI_API_KEY }
  - model_name: gemini/gemini-2.0-flash
    litellm_params: { model: gemini/gemini-2.0-flash, api_key: os.environ/GEMINI_API_KEY }

  # ── Fireworks (Kimi K2, DeepSeek V3, Llama 4) ──
  - model_name: fireworks_ai/kimi-k2-thinking
    litellm_params: { model: fireworks_ai/accounts/fireworks/models/kimi-k2-thinking, api_key: os.environ/FIREWORKS_AI_API_KEY }
  - model_name: fireworks_ai/deepseek-v3p2
    litellm_params: { model: fireworks_ai/accounts/fireworks/models/deepseek-v3p2, api_key: os.environ/FIREWORKS_AI_API_KEY }
  - model_name: fireworks_ai/llama4-maverick-instruct-basic
    litellm_params: { model: fireworks_ai/accounts/fireworks/models/llama4-maverick-instruct-basic, api_key: os.environ/FIREWORKS_AI_API_KEY }

  # ── AWS Bedrock (Mistral Large 3, Qwen3) ──
  # Bedrock auth is via AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION_NAME
  - model_name: bedrock/mistral.mistral-large-3-675b-instruct
    litellm_params: { model: bedrock/mistral.mistral-large-3-675b-instruct }
  - model_name: bedrock/qwen.qwen3-235b-a22b-2507-v1:0
    litellm_params: { model: bedrock/qwen.qwen3-235b-a22b-2507-v1:0 }

# A virtual key that the ROK-FORTRESS code presents to the proxy.
# Replace with anything; the proxy enforces real provider keys upstream.
general_settings:
  master_key: sk-anything-the-proxy-accepts
