[project]
name = "rok-fortress"
version = "0.1.0"
description = "ROK-FORTRESS: Extension of FORTRESS benchmark for Korean language and cultural adaptations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ROK-FORTRESS authors (Scale AI, Korea AI Safety Institute)", email = "yash.maurya@scale.com" },
]
license = { text = "MIT" }
dependencies = [
    "easydict>=1.13",
    "httpx>=0.28.1",
    "litellm>=1.80.11",
    "matplotlib>=3.10.8",
    "openai>=2.0.0",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "scipy>=1.14",
    "seaborn>=0.13.2",
    "tenacity>=9.1.2",
    "vllm>=0.33.0",
]

[project.urls]
Repository = "https://github.com/yash-scaleai/ROK-FORTRESS-release"
Dataset = "https://huggingface.co/datasets/ScaleAI/ROK-FORTRESS_public"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]


[tool.uv]
# Security overrides: litellm caps filelock<4 and vllm caps setuptools<81, but the
# fixed releases are filelock>=4.2.1 and setuptools>=84.1 (pip-audit, 2026-11-06).
override-dependencies = ["filelock>=4.2.1", "setuptools>=84.1"]
